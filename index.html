<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Data URI Converter</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; color: #333; }
        .drop-zone { border: 2px dashed #ccc; padding: 30px; text-align: center; background: #fff; cursor: pointer; border-radius: 8px; }
        .drop-zone:hover { border-color: #0076ff; background: #f0f7ff; }
        textarea { width: 100%; height: 150px; margin-top: 20px; font-family: monospace; padding: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #0076ff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .preview-container { margin-top: 15px; display: none; text-align: center; }
        .preview-container img, .preview-container video { max-width: 100%; max-height: 200px; border-radius: 4px; }
        .file-info { font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; color: #555; }
        #copy-indicator { border-style: solid; border-radius: 5px; border-color: #333; background-color: #333; color: #fff; }
    </style>
</head>
<body>

    <h2>Universal Data URI Converter</h2>
    <p>Convert any file type 100% locally in your browser.</p>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <span>Drag & drop <strong>any file</strong> here or <strong>browse</strong></span>
        <!-- Changed accept="*" to allow any file type -->
        <input type="file" id="fileInput" accept="*" style="display: none;">
    </div>

    <div id="previewContainer" class="preview-container">
        <div id="fileInfo" class="file-info"></div>
        <div id="mediaPreview"></div>
    </div>
    
    <textarea id="output" readonly placeholder="Your Data URI will appear here..."></textarea>
    <button id="copyBtn" style="display: none;" onclick="copyToClipboard()">Copy to Clipboard</button>
    <br>
    <div id="copy-indicator" hidden>
        <span>Copied!</span>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const previewContainer = document.getElementById('previewContainer');
        const fileInfo = document.getElementById('fileInfo');
        const mediaPreview = document.getElementById('mediaPreview');
        const copyBtn = document.getElementById('copyBtn');

        fileInput.addEventListener('change', function(e) {
            document.getElementById('copy-indicator').hidden = true
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(event) {
                const dataUri = event.target.result;
                output.value = dataUri;
                
                // Show file meta details
                fileInfo.textContent = `File: ${file.name} (${(file.size / 1024).toFixed(1)} KB) | Type: ${file.type || 'unknown'}`;
                
                // Smart preview handler depending on the media type
                if (file.type.startsWith('image/')) {
                    mediaPreview.innerHTML = `<img src="${dataUri}" alt="Preview">`;
                } else if (file.type.startsWith('video/')) {
                    mediaPreview.innerHTML = `<video src="${dataUri}" controls></video>`;
                } else if (file.type.startsWith('audio/')) {
                    mediaPreview.innerHTML = `<audio src="${dataUri}" controls></audio>`;
                } else {
                    mediaPreview.innerHTML = `<span>Preview not available for this file type</span>`;
                }

                previewContainer.style.display = 'block';
                copyBtn.style.display = 'inline-block';
            };

            reader.readAsDataURL(file);
        });

        function copyToClipboard() {
            output.select();
            document.execCommand('copy');
            document.getElementById('copy-indicator').hidden = false
        }
    </script>

</body>
</html>
